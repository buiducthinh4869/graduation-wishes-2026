<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi lời chúc đến Thịnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #C8E6C4;
    --mint2: #B2DFDB;
    --pink: #F8BBD9;
    --pink2: #F48FB1;
    --blue: #BBDEFB;
    --blue2: #90CAF9;
    --white: #FAFAFA;
    --charcoal: #2C2A24;
    --accent: #C06080;
    --sage: #5B8A6F;
    --sage-dark: #4A7460;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', sans-serif;
    color: var(--charcoal);
  }
  body {
    background: linear-gradient(180deg, #E8F5E9 0%, #FCE4EC 100%);
  }
  canvas#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #FFFFFF;
    border: 1.5px solid var(--pink);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px rgba(240, 150, 180, 0.18);
    text-align: center;
  }
  .illustration {
    width: 160px;
    height: auto;
    margin: 0 auto 16px;
    display: block;
    border: none;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  h1 {
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 12px;
    color: var(--charcoal);
  }
  .subtext {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
    color: #666;
    margin: 0 0 28px;
  }
  form {
    text-align: left;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #444;
  }
  .field {
    margin-bottom: 20px;
  }
  input[type="text"],
  textarea {
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid #E0E0E0;
    border-radius: 12px;
    background: var(--white);
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.2s ease;
    resize: none;
  }
  input[type="text"]:focus,
  textarea:focus {
    border-color: var(--pink2);
  }
  textarea {
    height: 120px;
  }
  ::placeholder {
    color: #AAA;
    font-weight: 400;
  }
  button {
    width: 100%;
    padding: 14px;
    background: var(--sage);
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover {
    background: var(--sage-dark);
  }
  .thanks {
    padding: 10px 0;
  }
  .thanks h2 {
    font-weight: 700;
    font-size: 22px;
    margin: 4px 0 12px;
    color: var(--charcoal);
  }
  .thanks p {
    font-size: 15px;
    font-weight: 400;
    color: #666;
    line-height: 1.6;
  }
  .nav-link {
    display: block;
    text-align: center;
    margin-top: 26px;
    font-size: 13px;
    font-weight: 400;
    color: #999;
    text-decoration: none;
  }
  .nav-link:hover {
    color: var(--accent);
  }
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="wrap">
  <div class="card">
    <img class="illustration" id="illustration" src="" alt="">

    <div id="formArea">
      <div class="eyebrow">Lễ tốt nghiệp · 2026</div>
      <h1>Gửi lời chúc đến Thịnh</h1>
      <p class="subtext">Lời chúc của bạn sẽ được lưu lại và chỉ mình Thịnh đọc được.</p>

      <form id="wishForm">
        <div class="field">
          <label for="name">Tên của bạn</label>
          <input type="text" id="name" placeholder="Bạn bè, gia đình, hoặc ẩn danh...">
        </div>
        <div class="field">
          <label for="wish">Lời chúc</label>
          <textarea id="wish" placeholder="Viết gì đó từ trái tim..." required></textarea>
        </div>
        <button type="submit">Gửi lời chúc</button>
      </form>
    </div>

    <a class="nav-link" href="admin.html">Thịnh đọc lời chúc →</a>
  </div>
</div>

<script>
  // ---- Random illustration ----
  const images = ['assets/img1.png', 'assets/img2.png', 'assets/img3.png'];
  document.getElementById('illustration').src = images[Math.floor(Math.random() * images.length)];

  // ---- Particle animation ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const colors = ['#F8BBD9', '#BBDEFB', '#C8E6C4', '#FFF9C4'];
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + Math.random() * 40,
      r: 2 + Math.random() * 3,
      heart: Math.random() < 0.35,
      speed: 0.2 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.005 + Math.random() * 0.01,
      wobbleAmp: 0.3 + Math.random() * 0.7,
      opacity: 0.3 + Math.random() * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  for (let i = 0; i < 60; i++) particles.push(makeParticle(true));

  function drawHeart(x, y, size, color, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 1, -2, -2, -5, -2);
    ctx.bezierCurveTo(-9, -2, -9, 3, -9, 3);
    ctx.bezierCurveTo(-9, 6, -6, 9, 0, 12);
    ctx.bezierCurveTo(6, 9, 9, 6, 9, 3);
    ctx.bezierCurveTo(9, 3, 9, -2, 5, -2);
    ctx.bezierCurveTo(2, -2, 0, 1, 0, 3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = opacity;
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.speed;
      p.wobble += p.wobbleSpeed;
      p.x += Math.sin(p.wobble) * p.wobbleAmp * 0.1;

      if (p.y < -10) {
        p.y = H + 10;
        p.x = Math.random() * W;
      }

      if (p.heart) {
        drawHeart(p.x, p.y, p.r * 2.2, p.color, p.opacity);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();

  // ---- Wish form ----
  const form = document.getElementById('wishForm');
  const formArea = document.getElementById('formArea');
  const illustrationSrc = document.getElementById('illustration').src;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const wish = document.getElementById('wish').value.trim();
    if (!wish) return;

    const wishes = JSON.parse(localStorage.getItem('graduationWishes') || '[]');
    wishes.push({
      name: name || 'Ẩn danh',
      wish: wish,
      time: new Date().toISOString()
    });
    localStorage.setItem('graduationWishes', JSON.stringify(wishes));

    formArea.innerHTML = `
      <div class="thanks">
        <h2>Cảm ơn bạn! 🌸</h2>
        <p>Lời chúc ấm áp của bạn đã được gửi đến Thịnh.<br>Chúc bạn một ngày thật vui!</p>
      </div>
    `;
  });
</script>
</body>
</html>
