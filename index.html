<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi lời chúc đến Thịnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', sans-serif;
    color: #2C2A24;
  }
  body {
    background: linear-gradient(180deg, #E8F5E9 0%, #FCE4EC 100%);
    position: relative;
    overflow-x: hidden;
  }
  canvas#particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .corner-img {
    position: fixed;
    z-index: 0;
    pointer-events: none;
  }
  #corner-tl {
    top: -10px;
    left: -15px;
    width: 210px;
    opacity: 0.88;
    transform: rotate(8deg);
  }
  #corner-tr {
    top: 40px;
    right: -15px;
    width: 200px;
    opacity: 0.88;
    transform: rotate(-6deg);
  }
  #corner-bl {
    bottom: -20px;
    left: -10px;
    width: 220px;
    opacity: 0.88;
    transform: rotate(-8deg);
  }
  #corner-br {
    bottom: 30px;
    right: 20px;
    width: 180px;
    opacity: 0.88;
    transform: rotate(4deg);
  }
  @media (max-width: 600px) {
    .corner-img { width: 125px; }
    #corner-tr { display: none; }
    #corner-tl { top: -5px; left: -8px; }
    #corner-bl { bottom: -10px; left: -5px; }
    #corner-br { bottom: 10px; right: -5px; }
  }
  .wrap {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #FFFFFF;
    border: 1.5px solid #F8BBD9;
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px rgba(240, 150, 180, 0.18);
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C06080;
    margin-bottom: 10px;
  }
  h1 {
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 8px;
    color: #2C2A24;
  }
  .subtext {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
    color: #555555;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #333333;
  }
  .field {
    margin-bottom: 20px;
  }
  input[type="text"],
  textarea {
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid #E0E0E0;
    border-radius: 12px;
    background: #FFFFFF;
    color: #2C2A24;
    outline: none;
    transition: border-color 0.2s ease;
    resize: none;
  }
  input[type="text"]:focus,
  textarea:focus {
    border-color: #F48FB1;
    outline: none;
  }
  textarea {
    height: 130px;
    line-height: 1.6;
  }
  ::placeholder {
    color: #AAA;
    font-weight: 400;
  }
  .field-error {
    font-size: 13px;
    font-weight: 400;
    color: #C06080;
    margin-top: 4px;
    display: none;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #5B8A6F;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover {
    background: #4A7560;
  }
  .thanks {
    display: none;
    text-align: center;
  }
  .thanks h2 {
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 10px;
    color: #2C2A24;
  }
  .thanks .from {
    font-size: 15px;
    color: #888888;
    margin: 0 0 10px;
  }
  .thanks .note {
    font-size: 15px;
    font-weight: 400;
    color: #555555;
    margin: 0 0 24px;
  }
  .thanks button {
    font-size: 14px;
    padding: 12px;
  }
  .bottom-link {
    margin-top: 20px;
    font-size: 13px;
    color: #999999;
    text-decoration: none;
  }
  .bottom-link:hover {
    color: #666666;
  }
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<img class="corner-img" id="corner-tl" src="assets/img4.jpg" alt="">
<img class="corner-img" id="corner-tr" src="assets/img2.png" alt="">
<img class="corner-img" id="corner-bl" src="assets/img1.png" alt="">
<img class="corner-img" id="corner-br" src="assets/img3.png" alt="">

<div class="wrap">
  <div class="card">
    <div id="formView">
      <div class="eyebrow">Lễ tốt nghiệp · 2026</div>
      <h1>Gửi lời chúc đến Thịnh</h1>
      <p class="subtext">Lời chúc của bạn sẽ được lưu lại và chỉ mình Thịnh đọc được.</p>

      <form id="wishForm">
        <div class="field">
          <label for="name">Tên của bạn</label>
          <input type="text" id="name" placeholder="Bạn bè, gia đình, hoặc ẩn danh...">
        </div>
        <div class="field">
          <label for="wish">Lời chúc</label>
          <textarea id="wish" placeholder="Viết gì đó từ trái tim..."></textarea>
          <div class="field-error" id="wishError">Bạn chưa viết lời chúc.</div>
        </div>
        <button type="submit">Gửi lời chúc</button>
      </form>
    </div>

    <div class="thanks" id="thanksView">
      <h2>Cảm ơn bạn! 🌸</h2>
      <p class="from" id="thanksFrom"></p>
      <p class="note">Thịnh sẽ đọc lời chúc của bạn.</p>
      <button id="againBtn">Gửi thêm lời chúc</button>
    </div>
  </div>

  <a class="bottom-link" href="admin.html">Thịnh đọc lời chúc →</a>
</div>

<script>
  // ---- Particle animation ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const colors = ['#F8BBD9', '#BBDEFB', '#C8E6C4', '#FFF9C4', '#F0E6FF'];
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + Math.random() * 40,
      r: 2 + Math.random() * 2,
      heart: Math.random() < 0.35,
      speed: 0.2 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.005 + Math.random() * 0.01,
      wobbleAmp: 0.3 + Math.random() * 0.7,
      opacity: 0.3 + Math.random() * 0.25,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  for (let i = 0; i < 60; i++) particles.push(makeParticle(true));

  function drawHeart(x, y, size, color, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 1, -2, -2, -5, -2);
    ctx.bezierCurveTo(-9, -2, -9, 3, -9, 3);
    ctx.bezierCurveTo(-9, 6, -6, 9, 0, 12);
    ctx.bezierCurveTo(6, 9, 9, 6, 9, 3);
    ctx.bezierCurveTo(9, 3, 9, -2, 5, -2);
    ctx.bezierCurveTo(2, -2, 0, 1, 0, 3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = opacity;
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.speed;
      p.wobble += p.wobbleSpeed;
      p.x += Math.sin(p.wobble) * p.wobbleAmp * 0.1;

      if (p.y < -10) {
        p.y = H + 10;
        p.x = Math.random() * W;
      }

      if (p.heart) {
        drawHeart(p.x, p.y, p.r * 2.2, p.color, p.opacity);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();

  // ---- Wish form ----
  const STORAGE_KEY = 'graduation_wishes';
  const form = document.getElementById('wishForm');
  const formView = document.getElementById('formView');
  const thanksView = document.getElementById('thanksView');
  const thanksFrom = document.getElementById('thanksFrom');
  const wishError = document.getElementById('wishError');
  const nameInput = document.getElementById('name');
  const wishInput = document.getElementById('wish');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = nameInput.value.trim();
    const wish = wishInput.value.trim();

    if (!wish) {
      wishError.style.display = 'block';
      return;
    }
    wishError.style.display = 'none';

    const wishes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    wishes.push({
      name: name || 'Ẩn danh',
      wish: wish,
      time: new Date().toISOString()
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));

    thanksFrom.textContent = name ? '— ' + name : '';
    formView.style.display = 'none';
    thanksView.style.display = 'block';
  });

  document.getElementById('againBtn').addEventListener('click', function () {
    nameInput.value = '';
    wishInput.value = '';
    wishError.style.display = 'none';
    thanksView.style.display = 'none';
    formView.style.display = 'block';
  });
</script>
</body>
</html>
