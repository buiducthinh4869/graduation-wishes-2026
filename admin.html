<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lời chúc dành cho Thịnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #C8E6C4;
    --mint2: #B2DFDB;
    --pink: #F8BBD9;
    --pink2: #F48FB1;
    --blue: #BBDEFB;
    --blue2: #90CAF9;
    --white: #FAFAFA;
    --charcoal: #2C2A24;
    --accent: #C06080;
    --sage: #5B8A6F;
    --sage-dark: #4A7460;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', sans-serif;
    color: var(--charcoal);
  }
  body {
    background: linear-gradient(180deg, #E8F5E9 0%, #FCE4EC 100%);
  }
  canvas#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .topnav {
    position: relative;
    z-index: 1;
    padding: 20px 24px;
  }
  .topnav a {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .topnav a:hover {
    color: var(--pink2);
  }
  .wrap {
    position: relative;
    z-index: 1;
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 20px 60px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #FFFFFF;
    border: 1.5px solid var(--pink);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px rgba(240, 150, 180, 0.18);
    text-align: center;
  }
  .illustration {
    width: 160px;
    height: auto;
    margin: 0 auto 16px;
    display: block;
    border: none;
  }
  .illustration.small {
    width: 120px;
    margin: 0 auto 12px;
  }
  h1 {
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 22px;
    color: var(--charcoal);
  }
  form {
    text-align: left;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #444;
  }
  .field {
    margin-bottom: 20px;
  }
  input[type="password"] {
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid #E0E0E0;
    border-radius: 12px;
    background: var(--white);
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.2s ease;
  }
  input[type="password"]:focus {
    border-color: var(--pink2);
  }
  ::placeholder {
    color: #AAA;
    font-weight: 400;
  }
  button {
    width: 100%;
    padding: 14px;
    background: var(--sage);
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover {
    background: var(--sage-dark);
  }
  .error-msg {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin: -10px 0 16px;
  }
  .wide {
    max-width: 640px;
    text-align: left;
  }
  .wishes-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .wishes-header h1 {
    margin: 0;
  }
  .count {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .wish-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }
  .wish-card {
    background: #FFFFFF;
    border: 1px solid var(--pink);
    border-radius: 16px;
    padding: 20px;
  }
  .wish-name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--charcoal);
  }
  .wish-text {
    font-weight: 400;
    font-size: 15px;
    line-height: 1.7;
    color: #444;
    white-space: pre-wrap;
    margin-bottom: 10px;
  }
  .wish-time {
    font-weight: 400;
    font-size: 13px;
    color: #999;
  }
  .empty-state {
    text-align: center;
    padding: 10px 0 30px;
  }
  .empty-state p {
    font-size: 15px;
    font-weight: 600;
    color: #999;
  }
  .clear-btn {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--pink2);
    font-size: 14px;
    padding: 12px;
  }
  .clear-btn:hover {
    background: rgba(244, 143, 177, 0.1);
  }
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="topnav"><a href="index.html">← Quay lại</a></div>

<div class="wrap">
  <div id="gateArea" class="card">
    <img class="illustration" id="gateIllustration" src="" alt="">
    <h1 style="text-align:center;">Đọc lời chúc</h1>
    <form id="gateForm">
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div id="gateError" class="error-msg" style="display:none;">Mật khẩu không đúng.</div>
      <button type="submit">Xem lời chúc</button>
    </form>
  </div>

  <div id="wishesArea" class="card wide" style="display:none;">
    <div class="wishes-header">
      <h1>Lời chúc dành cho Thịnh</h1>
      <span class="count" id="wishCount"></span>
    </div>
    <div id="wishList" class="wish-list"></div>
    <button class="clear-btn" id="clearBtn">Xóa tất cả</button>
  </div>
</div>

<script>
  // ---- Random illustration ----
  const images = ['assets/img1.png', 'assets/img2.png', 'assets/img3.png'];
  function randomImage() {
    return images[Math.floor(Math.random() * images.length)];
  }
  document.getElementById('gateIllustration').src = randomImage();

  // ---- Particle animation ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const colors = ['#F8BBD9', '#BBDEFB', '#C8E6C4', '#FFF9C4'];
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + Math.random() * 40,
      r: 2 + Math.random() * 3,
      heart: Math.random() < 0.35,
      speed: 0.2 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.005 + Math.random() * 0.01,
      wobbleAmp: 0.3 + Math.random() * 0.7,
      opacity: 0.3 + Math.random() * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  for (let i = 0; i < 60; i++) particles.push(makeParticle(true));

  function drawHeart(x, y, size, color, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 1, -2, -2, -5, -2);
    ctx.bezierCurveTo(-9, -2, -9, 3, -9, 3);
    ctx.bezierCurveTo(-9, 6, -6, 9, 0, 12);
    ctx.bezierCurveTo(6, 9, 9, 6, 9, 3);
    ctx.bezierCurveTo(9, 3, 9, -2, 5, -2);
    ctx.bezierCurveTo(2, -2, 0, 1, 0, 3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = opacity;
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.speed;
      p.wobble += p.wobbleSpeed;
      p.x += Math.sin(p.wobble) * p.wobbleAmp * 0.1;

      if (p.y < -10) {
        p.y = H + 10;
        p.x = Math.random() * W;
      }

      if (p.heart) {
        drawHeart(p.x, p.y, p.r * 2.2, p.color, p.opacity);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();

  // ---- Password gate ----
  const ADMIN_PASSWORD = '112911Thinh@';
  const gateForm = document.getElementById('gateForm');
  const gateArea = document.getElementById('gateArea');
  const gateError = document.getElementById('gateError');
  const wishesArea = document.getElementById('wishesArea');

  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const input = document.getElementById('password').value;
    if (input === ADMIN_PASSWORD) {
      gateArea.style.display = 'none';
      wishesArea.style.display = 'block';
      renderWishes();
    } else {
      gateError.style.display = 'block';
    }
  });

  function renderWishes() {
    const wishes = JSON.parse(localStorage.getItem('graduationWishes') || '[]');
    const list = document.getElementById('wishList');
    const countEl = document.getElementById('wishCount');
    countEl.textContent = wishes.length + ' lời chúc';

    if (wishes.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <img class="illustration small" src="${randomImage()}" alt="">
          <p>Chưa có lời chúc nào.</p>
        </div>
      `;
      return;
    }

    const sorted = wishes.slice().sort((a, b) => new Date(b.time) - new Date(a.time));

    list.innerHTML = sorted.map(w => {
      const formattedTime = new Date(w.time).toLocaleString('vi-VN', {
        dateStyle: 'long',
        timeStyle: 'short'
      });
      return `
        <div class="wish-card">
          <div class="wish-name">${escapeHtml(w.name)}</div>
          <div class="wish-text">${escapeHtml(w.wish)}</div>
          <div class="wish-time">${formattedTime}</div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (confirm('Bạn có chắc muốn xóa tất cả lời chúc? Hành động này không thể hoàn tác.')) {
      localStorage.removeItem('graduationWishes');
      renderWishes();
    }
  });
</script>
</body>
</html>
