<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lời chúc dành cho Thịnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', sans-serif;
    color: #2C2A24;
  }
  body {
    background: linear-gradient(rgba(30, 20, 50, 0.18), rgba(30, 20, 50, 0.18)), url('assets/bg.jpg');
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    position: relative;
    overflow-x: hidden;
  }
  canvas#particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .back-link {
    position: relative;
    z-index: 10;
    display: inline-block;
    margin: 20px;
    font-size: 14px;
    font-weight: 400;
    color: #888888;
    text-decoration: none;
  }
  .back-link:hover {
    color: #555555;
  }
  .wrap {
    position: relative;
    z-index: 10;
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 20px 60px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(255, 252, 248, 0.92);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(200, 170, 140, 0.5);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 8px 40px rgba(60, 40, 80, 0.18);
  }
  .card.wide {
    max-width: 640px;
  }
  h1 {
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 8px;
    color: #2C2A24;
  }
  .subtext {
    font-size: 15px;
    font-weight: 400;
    color: #555555;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #333333;
  }
  .field {
    margin-bottom: 20px;
  }
  input[type="password"] {
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid #E0E0E0;
    border-radius: 12px;
    background: #FFFFFF;
    color: #2C2A24;
    outline: none;
    transition: border-color 0.2s ease;
  }
  input[type="password"]:focus {
    border-color: #B09CC8;
    outline: none;
  }
  ::placeholder {
    color: #AAA;
    font-weight: 400;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #6B5B8A;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover {
    background: #574875;
  }
  .error-msg {
    font-size: 14px;
    font-weight: 400;
    color: #C06080;
    margin: -10px 0 16px;
    display: none;
  }
  .wishes-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .wishes-header h1 {
    margin: 0;
  }
  .count {
    font-size: 14px;
    font-weight: 400;
    color: #888888;
  }
  .wish-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .wish-card {
    background: #FFFFFF;
    border: 1px solid #F8BBD9;
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .wish-name {
    font-weight: 700;
    font-size: 16px;
    color: #2C2A24;
  }
  .wish-text {
    font-weight: 400;
    font-size: 15px;
    line-height: 1.75;
    color: #444444;
    white-space: pre-wrap;
    margin: 8px 0;
  }
  .wish-time {
    font-weight: 400;
    font-size: 13px;
    color: #999999;
  }
  .empty-state {
    text-align: center;
    padding: 10px 0;
  }
  .empty-state p {
    font-size: 16px;
    font-weight: 400;
    color: #888888;
  }
  .clear-btn {
    width: auto;
    display: inline-block;
    background: #f5f5f5;
    color: #999999;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 400;
    margin-top: 24px;
  }
  .clear-btn:hover {
    background: #eeeeee;
  }
  @media (max-width: 480px) {
    .card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<a class="back-link" href="index.html">← Quay lại</a>

<div class="wrap">
  <div id="gateArea" class="card">
    <h1>Đọc lời chúc</h1>
    <p class="subtext">Nhập mật khẩu để xem lời chúc.</p>
    <form id="gateForm">
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div id="gateError" class="error-msg">Mật khẩu không đúng.</div>
      <button type="submit">Xem lời chúc</button>
    </form>
  </div>

  <div id="wishesArea" class="card wide" style="display:none;">
    <div class="wishes-header">
      <h1>Lời chúc dành cho Thịnh 🌸</h1>
      <span class="count" id="wishCount"></span>
    </div>
    <div id="wishList" class="wish-list"></div>
    <button class="clear-btn" id="clearBtn">Xóa tất cả lời chúc</button>
  </div>
</div>

<script>
  // ---- Particle animation ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const colors = ['#F8BBD9', '#BBDEFB', '#C8E6C4', '#FFF9C4', '#F0E6FF'];
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + Math.random() * 40,
      r: 2 + Math.random() * 2,
      heart: Math.random() < 0.35,
      speed: 0.2 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.005 + Math.random() * 0.01,
      wobbleAmp: 0.3 + Math.random() * 0.7,
      opacity: 0.3 + Math.random() * 0.25,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  for (let i = 0; i < 60; i++) particles.push(makeParticle(true));

  function drawHeart(x, y, size, color, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 1, -2, -2, -5, -2);
    ctx.bezierCurveTo(-9, -2, -9, 3, -9, 3);
    ctx.bezierCurveTo(-9, 6, -6, 9, 0, 12);
    ctx.bezierCurveTo(6, 9, 9, 6, 9, 3);
    ctx.bezierCurveTo(9, 3, 9, -2, 5, -2);
    ctx.bezierCurveTo(2, -2, 0, 1, 0, 3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = opacity;
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.speed;
      p.wobble += p.wobbleSpeed;
      p.x += Math.sin(p.wobble) * p.wobbleAmp * 0.1;

      if (p.y < -10) {
        p.y = H + 10;
        p.x = Math.random() * W;
      }

      if (p.heart) {
        drawHeart(p.x, p.y, p.r * 2.2, p.color, p.opacity);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();

  // ---- Password gate ----
  const STORAGE_KEY = 'graduation_wishes';
  const ADMIN_PASSWORD = '112911Thinh@';
  const gateForm = document.getElementById('gateForm');
  const gateArea = document.getElementById('gateArea');
  const gateError = document.getElementById('gateError');
  const wishesArea = document.getElementById('wishesArea');

  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const input = document.getElementById('password').value;
    if (input === ADMIN_PASSWORD) {
      gateArea.style.display = 'none';
      wishesArea.style.display = 'block';
      renderWishes();
    } else {
      gateError.style.display = 'block';
    }
  });

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function formatVietnameseDate(iso) {
    const d = new Date(iso);
    return `ngày ${pad(d.getDate())} tháng ${pad(d.getMonth() + 1)} năm ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderWishes() {
    const wishes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const list = document.getElementById('wishList');
    const countEl = document.getElementById('wishCount');
    countEl.textContent = wishes.length + ' lời chúc';

    if (wishes.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <p>Chưa có lời chúc nào.</p>
        </div>
      `;
      return;
    }

    const sorted = wishes.slice().sort((a, b) => new Date(b.time) - new Date(a.time));

    list.innerHTML = sorted.map(w => `
      <div class="wish-card">
        <div class="wish-name">${escapeHtml(w.name)}</div>
        <div class="wish-text">${escapeHtml(w.wish)}</div>
        <div class="wish-time">${formatVietnameseDate(w.time)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (confirm('Xóa tất cả lời chúc? Không thể hoàn tác.')) {
      localStorage.removeItem(STORAGE_KEY);
      renderWishes();
    }
  });
</script>
</body>
</html>
